server:
  port: 8080

jwt:
  secret: Y2FtcHVzLW1pY3JvLW1hcnQtc2VjcmV0LWtleS0yMDI0LXNlY3VyZS1rZXktYmFzZTY0
  expiration: 604800

spring:
  main:
    web-application-type: reactive
  autoconfigure:
    exclude:
      - com.alibaba.cloud.nacos.NacosConfigAutoConfiguration
      - com.alibaba.cloud.nacos.discovery.NacosDiscoveryAutoConfiguration
  redis:
    host: 127.0.0.1
    port: 6379
    database: 0
    timeout: 3000ms
    lettuce:
      pool:
        max-active: 10
        max-wait: -1
        max-idle: 5
        min-idle: 2
  cloud:
    gateway:
      routes:
        - id: product-service
          uri: http://localhost:8081
          predicates:
            - Path=/api/product/**
          filters:
            - StripPrefix=1
        - id: category-service
          uri: http://localhost:8081
          predicates:
            - Path=/api/category/**
          filters:
            - StripPrefix=1
        - id: order-service
          uri: http://localhost:8083
          predicates:
            - Path=/api/order/**
          filters:
            - StripPrefix=1
        - id: payment-service
          uri: http://localhost:8085
          predicates:
            - Path=/api/payment/**
          filters:
            - StripPrefix=1
        - id: user-service
          uri: http://localhost:8084
          predicates:
            - Path=/api/user/**
          filters:
            - StripPrefix=1
        - id: upload-service
          uri: http://localhost:8081
          predicates:
            - Path=/uploads/**

logging:
  level:
    root: WARN
    com.campus: INFO
