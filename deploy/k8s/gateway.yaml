apiVersion: apps/v1
kind: Deployment
metadata:
  name: campus-gateway
  labels:
    app: campus-gateway
spec:
  replicas: 2
  selector:
    matchLabels:
      app: campus-gateway
  template:
    metadata:
      labels:
        app: campus-gateway
    spec:
      containers:
        - name: campus-gateway
          image: campus/campus-gateway:1.0.0
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: campus-config
          env:
            - name: JAVA_OPTS
              value: "-Xms256m -Xmx512m"
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: campus-gateway
spec:
  selector:
    app: campus-gateway
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30080
  type: NodePort
